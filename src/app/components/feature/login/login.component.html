<div class="container-fluid vh-100 p-0 overflow-hidden">
  <div class="row h-100 m-0">
    <!-- Left Panel -->
    <div
      class="col-md-6 col-lg-6 d-none d-md-flex left-panel p-0 justify-content-center align-items-center"
    >
      <div class="brand-content text-center text-white p-4">
        <div class="logo-icon mb-4 mx-auto d-flex justify-content-center align-items-center">
          <!-- Toque Chef Hat Icon SVG -->
          <svg
            class="brand-icon-svg"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="white"
            fill="white"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path
              d="M12 3c1.918 0 3.52 1.35 3.91 3.151a4 4 0 0 1 2.09 7.723l0 7.126h-12v-7.126a4 4 0 1 1 2.092 -7.723a4 4 0 0 1 3.908 -3.151z"
            />
            <path d="M6.161 17.009l11.839 -.009" />
          </svg>
        </div>
        <h1 class="brand-name display-4 fw-bold mb-3">Sazón</h1>
        <p class="brand-tagline fs-5 fw-light opacity-75">
          Descubre, organiza y comparte tus recetas favoritas.<br />Tu viaje culinario comienza
          aquí.
        </p>
      </div>
    </div>

    <!-- Right Panel -->
    <div
      class="col-12 col-md-6 col-lg-6 right-panel bg-white d-flex justify-content-center align-items-center p-4"
    >
      <div class="login-form-container w-100">
        <h2 class="h3 fw-bold mb-2 text-dark">Bienvenido</h2>
        <p class="text-secondary mb-4 small">Inicia sesión en tu cuenta para continuar.</p>

        <form class="login-form">
          <div class="mb-3">
            <label for="email" class="form-label small fw-bold text-secondary mb-1"
              >Usuario o Correo electrónico</label
            >
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-white border-end-0 text-muted">
                <i class="bi bi-person"></i>
              </span>
              <input
                type="text"
                class="form-control"
                id="email"
                placeholder="nombre@ejemplo.com"
                [(ngModel)]="usernameOrEmail"
                 name="usernameOrEmail"
              />
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label small fw-bold text-secondary mb-1"
              >Contraseña</label
            >
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-white border-end-0 text-muted">
                <i class="bi bi-lock"></i>
              </span>
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Ingresa tu contraseña"
                [(ngModel)]="password"
                name="password"
              />

              <span class="input-group-text bg-white border-start-0 text-muted cursor-pointer">
                <i class="bi bi-eye"></i>
              </span>
            </div>
          </div>

          <div class="d-flex justify-content-end mb-4">
            <a href="#" class="small text-decoration-none fw-bold text-brand"
              >¿Olvidaste tu contraseña?</a
            >
          </div>

          <button
            type="button"
            class="btn btn-primary btn-sm w-100 fw-bold py-2 mb-4"
            (click)="onLogin()"
          >
            Iniciar Sesión
          </button>
        </form>

        <div class="divider d-flex align-items-center my-3 text-secondary">
          <hr class="flex-grow-1 my-0" />
          <span class="px-2 small">o</span>
          <hr class="flex-grow-1 my-0" />
        </div>

        <div class="text-center mb-5 small text-secondary">
          ¿Aún no estás registrado?
          <a routerLink="/register" class="text-decoration-none fw-bold text-brand">Regístrate</a>
        </div>

        <div class="footer-links d-flex justify-content-center gap-3 text-secondary">
          <a href="#" class="text-decoration-none text-secondary">Política de Privacidad</a>
          <span>•</span>
          <a href="#" class="text-decoration-none text-secondary">Términos de Servicio</a>
        </div>
      </div>
    </div>
  </div>
</div>
