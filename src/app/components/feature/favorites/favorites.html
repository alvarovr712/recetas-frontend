<app-recipe-grid 
    title="Favoritos" 
    description="Tus recetas guardadas para cocinar en cualquier momento."
    [recipes]="favoriteRecipes"
    searchMode="favorites"
    (favoriteToggled)="onFavoriteToggled($event)"
    (categoryChanged)="onCategoryChanged($event)"
    (searchCleared)="loadFavorites()">
</app-recipe-grid>
