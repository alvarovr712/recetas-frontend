<nav class="sidebar">
  <div class="logo-container">
    <div class="logo-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M11 9H9V2H7V9H5V2H3V9C3 11.12 4.66 12.84 6.75 12.97V22H9.25V12.97C11.34 12.84 13 11.12 13 9V2H11V9ZM16 6V14H18.5V22H21V2C18.24 2 16 4.24 16 6Z"
          fill="white" />
      </svg>
    </div>
    <div class="logo-text">
      <span class="brand-name">Sazón</span>
      <span class="brand-subtitle">Recetas Premium</span>
    </div>
  </div>

  <div class="menu-section">
    <a *ngFor="let item of (menuItems$ | async)" [routerLink]="item.route" routerLinkActive="active" class="menu-item" (click)="onNavItemClick()">
      <span class="icon">
        <i [class]="item.icon" style="font-size: 1rem;"></i>
      </span>
      <span class="label">{{ item.label }}</span>
    </a>

    <!-- Configuración Dropdown -->
    <div class="menu-item-dropdown">
      <div class="menu-item" (click)="toggleConfig()" [class.active-parent]="configOpen">
        <span class="icon">
          <i class="bi bi-gear" style="font-size: 1rem;"></i>
        </span>
        <span class="label">Configuración</span>
        <span class="arrow-icon" [style.transform]="configOpen ? 'rotate(90deg)' : 'rotate(0)'">
          <i class="bi bi-chevron-right" style="font-size: 0.8rem;"></i>
        </span>
      </div>
      
      <div class="dropdown-content" *ngIf="configOpen">
        <a *ngIf="(currentUserRole$ | async) === Role.ADMIN" 
           routerLink="/admin/dashboard" 
           routerLinkActive="active" 
           class="menu-item sub-item" 
           (click)="onNavItemClick()">
          <span class="icon">
            <i class="bi bi-speedometer2" style="font-size: 0.9rem;"></i>
          </span>
          <span class="label">Dashboard</span>
        </a>
      </div>
    </div>
  </div>

  <div class="bottom-section">


    <button class="logout-btn" (click)="logout()">
      <span class="icon">
        <i class="bi bi-box-arrow-right" style="font-size: 0.9rem;"></i>
      </span>
      <span class="label">Cerrar sesión</span>
    </button>
  </div>
</nav>
