<div class="top-navbar">
  <!-- Hamburger Menu for Mobile -->
  <button class="btn btn-link d-md-none me-2 text-dark p-0" (click)="layoutService.toggleSidebar()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <!-- Spacer to push content to the right -->
  <div class="spacer"></div>

  <!-- Profile Section -->
  <div class="profile-section">
    <div class="user-profile dropdown" [class.show]="showDropdown">
      <span class="username d-none d-md-block">{{ user.name }}</span>
      <div class="profile-avatar clickable" (click)="toggleDropdown()">
        <img [src]="user.avatarUrl | imageUrl" alt="Avatar" class="profile-icon">
        <div *ngIf="!user.avatarUrl" class="avatar-placeholder">
          <i class="bi bi-person-fill"></i>
        </div>
      </div>
      
      <!-- Dropdown Menu -->
      <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2" [class.show]="showDropdown">
        <li>
          <button class="dropdown-item py-2" (click)="goToProfile()">
            <i class="bi bi-person me-2"></i> Ver perfil
          </button>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <button class="dropdown-item py-2 text-danger" (click)="logout()">
            <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
          </button>
        </li>
      </ul>
    </div>
  </div>
</div>
