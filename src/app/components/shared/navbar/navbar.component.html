<div class="top-navbar">
  <!-- Hamburger Menu for Mobile -->
  <button class="btn btn-link d-md-none me-2 text-dark p-0" (click)="layoutService.toggleSidebar()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <!-- Spacer to push content to the right -->
  <div class="spacer"></div>

  <!-- Profile Section -->
  <div class="profile-section">
    <div class="profile-info">
      <span class="profile-name">{{ user.name }}</span>
    </div>
    <div class="profile-avatar">
      <!-- Simple avatar placeholder using initials or icon -->
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="20" fill="#9ca3af" />
        <path
          d="M20 10C22.21 10 24 11.79 24 14C24 16.21 22.21 18 20 18C17.79 18 16 16.21 16 14C16 11.79 17.79 10 20 10ZM20 20C25.34 20 29.67 22.75 30 26.65V28H10V26.65C10.33 22.75 14.66 20 20 20Z"
          fill="white" />
      </svg>
    </div>
  </div>
</div>
