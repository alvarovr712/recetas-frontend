<div class="container-fluid px-4 py-3">
    <!-- Search Header -->
    <header class="mb-4">
        <div class="search-bar shadow-sm">
            <i class="bi bi-search"></i>
            <input type="text" class="form-control border-0 shadow-none bg-transparent"
                placeholder="Buscar recetas, ingredientes..."
                (input)="onSearch($event)">
        </div>
    </header>

    <!-- Title Section -->
    <section class="title-section mb-4">
        <div class="d-flex flex-nowrap justify-content-between align-items-center gap-2 mb-1">
            <h1 class="display-6 fw-bold mb-0 text-truncate flex-grow-1">{{ title }}</h1>
            <div class="extra-actions-wrapper flex-shrink-0">
                <ng-content select="[extra-actions]"></ng-content>
            </div>
        </div>
        <p class="text-muted small mb-0 text-truncate w-100">{{ description }}</p>
    </section>

    <!-- Categories -->
    <nav class="categories-nav d-flex flex-wrap mb-4 gap-2">
        <button *ngFor="let cat of categories" class="btn btn-category btn-sm rounded-pill px-3 py-1 fw-bold"
            [class.active]="selectedCategory === cat.value" (click)="selectCategory(cat.value)">
            {{ cat.label }}
        </button>
    </nav>

    <!-- Recipes Grid -->
    <div class="row g-3 g-md-4 mb-5">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let recipe of recipes">
            <div class="recipe-card shadow-sm border-0 h-100 overflow-hidden" (click)="goToDetail(recipe.id)" style="cursor: pointer;">
                <div class="card-image-wrapper">
                    <img [src]="recipe.image | imageUrl" [alt]="recipe.title" class="hero-img w-100 h-100 object-fit-cover">
                    
                    <div class="edit-actions-container" *ngIf="showEditActions">
                        <button class="btn-action btn-edit shadow-sm" (click)="onEdit(recipe); $event.stopPropagation()">
                            <i class="bi bi-pencil-fill"></i>
                        </button>
                        <button class="btn-action btn-delete shadow-sm mt-2" (click)="onDelete(recipe); $event.stopPropagation()">
                            <i class="bi bi-trash-fill"></i>
                        </button>
                    </div>

                    <button class="favorite-btn border-0 shadow-sm overflow-hidden"
                        [class.is-favorite]="recipe.isFavorite" (click)="toggleFavorite(recipe); $event.stopPropagation()">
                        <i class="bi" [ngClass]="recipe.isFavorite ? 'bi-heart-fill' : 'bi-heart'"></i>
                    </button>
                </div>
                <div class="card-body p-3">
                    <span class="recipe-type fw-bold text-uppercase mb-1 d-block">{{ recipe.type }}</span>
                    <h6 class="card-title fw-bold mb-2">{{ recipe.title }}</h6>
                    <p class="card-text text-muted small mb-0 line-clamp-2">{{ recipe.description }}</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="explore-footer text-center py-4 border-top mt-auto">
        <p class="text-muted small fw-bold mb-0 text-uppercase tracking-wider">© 2026 SAZÓN - TU COMPAÑERO CULINARIO</p>
    </footer>
</div>
