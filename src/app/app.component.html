<div class="app-container">
    <app-sidebar *ngIf="!isAuthPage"></app-sidebar>

    <!-- Mobile Backdrop -->
    <div class="sidebar-backdrop" *ngIf="!isAuthPage && (layoutService.sidebarOpen$ | async)"
        (click)="layoutService.closeSidebar()">
    </div>

    <main class="main-content" [class.with-sidebar]="!isAuthPage">
        <app-navbar *ngIf="!isAuthPage"></app-navbar>
        <router-outlet></router-outlet>
    </main>
</div>
